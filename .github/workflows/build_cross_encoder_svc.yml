# File: .github/workflows/build_lottery.yml
name: Build CrossEncoder Container

on:
  push:
    branches:
      - zzLotteryTicket

jobs:
  build-and-push:
    name: cross-encoder-svc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push CrossEncoder Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./commands/cross_encoder/Dockerfile
          push: true
          tags: alienzimzum/cross-encoder:latest
