<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Company Analysis</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/deep_company_analysis.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

<nav class="navbar">
  <ul>
    <li><a href="/">🏠 Home</a></li>
    <li><a href="/document_tag_indexer">🏷️ Document Tag Indexer</a></li>
    <li><a href="/deep_company_analysis">🔬 Deep Company Analysis</a></li>
  </ul>
</nav>

<div class="content">
  <div class="panel dca-panel">

    <h1 class="dca-title">🔬 Deep Company Analysis</h1>

    <form id="analysisForm">
      <table class="dca-controls-table">
        <tr>
          <td><input type="text" name="symbol" id="symbolInput" placeholder="Symbol (e.g., AAPL)" required></td>
          <td>
            <select name="doc_type" id="docTypeSelect" required>
              <option value="" disabled selected>Document Type</option>
              <option value="10K">10-K</option>
              <option value="10Q">10-Q</option>
              <option value="FREE_TEXT">Free Text</option>
            </select>
          </td>
          <td><input type="text" name="year" id="yearInput" placeholder="Year" required></td>
          <td>
            <select name="quarter" id="quarterSelect" class="dca-hidden">
              <option value="" disabled selected>Quarter</option>
              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>
            </select>
          </td>
        </tr>
        <tr id="freeTextRow" class="dca-hidden">
          <td colspan="4">
            <div class="dca-file-upload-container">
              <input type="file" id="fileUploadInput" accept=".txt,.pdf,.doc,.docx" class="dca-file-input" style="display: none;">
              <button type="button" id="uploadFileBtn" class="dca-upload-btn">📄 Upload Document</button>
              <span id="uploadedFileName" class="dca-file-name"></span>
              <button type="button" id="clearFileBtn" class="dca-clear-btn dca-hidden">✕ Clear</button>
            </div>
            <textarea name="free_text" id="freeTextArea" class="dca-textarea" placeholder="Paste your text here OR upload a document above" rows="12"></textarea>
          </td>
        </tr>
      </table>
    </form>

    <div class="dca-button-container">
      <button type="button" id="sentimentBtn" class="dca-action-btn">
        <span class="btn-text">📊 Analyze Sentiment</span>
        <div class="spinner"></div>
      </button>
      <button type="button" id="topicsBtn" class="dca-action-btn">
        <span class="btn-text">🏷️ Analyze Topics</span>
        <div class="spinner"></div>
      </button>
      <button type="button" id="freeAnalysisBtn" class="dca-action-btn dca-hidden">
        <span class="btn-text">🤖 Free Analysis</span>
        <div class="spinner"></div>
      </button>
    </div>

    <div id="freeAnalysisPromptSection" class="dca-hidden">
      <div class="dca-prompt-section">
        <label for="promptSelector" style="display: block; margin-bottom: 8px; color: #58A6FF; font-weight: 500;">
          Custom Analysis Prompt:
        </label>
        <select id="promptSelector" class="dca-prompt-selector">
          <option value="">-- Select a predefined prompt --</option>
          <option value="standard_earnings">Standard Earnings Transcript Analysis</option>
        </select>
        <textarea id="freeAnalysisPrompt" class="dca-textarea" placeholder="Enter your custom prompt OR select a predefined prompt above" rows="6"></textarea>
      </div>
    </div>

    <div id="resultMessage" class="dca-result"></div>

    <!-- Topic Input Modal -->
    <div id="topicModal" class="dca-modal dca-hidden">
      <div class="dca-modal-content dca-modal-small">
        <div class="dca-modal-header">
          <h3>🏷️ Configure Topics for Analysis</h3>
          <button id="closeTopicModal" class="dca-modal-close">×</button>
        </div>
        <div class="dca-modal-body">
          <p style="color:#8B949E; margin-bottom:16px;">
            Enter a tag name and topics you want to extract from the document.
          </p>
          <input type="text" id="tagNameInput" class="dca-controls-table" style="width:100%; padding:12px; margin-bottom:12px; background:#21262D; border:1px solid #30363D; border-radius:8px; color:#E6EDF3;" placeholder="Tag name (e.g., ai_innovation)">
          <textarea id="topicsInput" class="dca-textarea" placeholder="Enter topics, one per line:&#10;AI Implementation&#10;Cost Management&#10;Pricing Power&#10;Market Competition&#10;Regulatory Risk" rows="10"></textarea>

          <div id="topicProgressContainer" class="dca-hidden" style="background:#0D1117; padding:12px; border-radius:6px; margin-top:12px; max-height:200px; overflow-y:auto;">
            <div id="topicProgressMessages"></div>
          </div>

          <button id="submitTopics" class="dca-action-btn" style="margin-top:16px; width:100%;">
            <span class="btn-text">Run Topic Analysis</span>
            <div class="spinner"></div>
          </button>
        </div>
      </div>
    </div>

    <!-- Results Modal -->
    <div id="resultsModal" class="dca-modal dca-hidden">
      <div class="dca-modal-content dca-modal-large">
        <div class="dca-modal-header">
          <h3 id="resultsModalTitle">📊 Analysis Results</h3>
          <button id="closeResultsModal" class="dca-modal-close">×</button>
        </div>
        <div class="dca-modal-body">
          <div id="resultsModalContent"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="/static/js/deep_company_analysis.js"></script>
</body>
</html>
