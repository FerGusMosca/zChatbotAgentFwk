<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sentiment Ranking Fallback — Bias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/sentiment_rankings_fallback.css">
</head>
<body class="srfb-body">

<nav class="srfb-nav">
  <a href="/" class="srfb-nav-logo">
    <span class="srfb-nav-logo-b">B</span>
    <span class="srfb-nav-logo-name">BIAS</span>
  </a>
  <ul class="srfb-nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/management_sentiment_rankings_fallback" class="active">Sentiment Ranking FB</a></li>
  </ul>
</nav>

<div class="srfb-page">

  <div class="srfb-page-header">
    <div class="srfb-eyebrow">Rankings · #7-Fb</div>
    <h1 class="srfb-title">📉 Sentiment Ranking Fallback</h1>
  </div>

  <div class="srfb-panel">

    <form id="fallbackForm" method="POST" class="srfb-form">

      <div class="srfb-field srfb-field-full">
        <label class="srfb-label">Query</label>
        <textarea id="freeText" name="freeText" required
                  placeholder="Example: Best optimism score..."
                  class="srfb-textarea"></textarea>
      </div>

      <div class="srfb-fields-row">

        <div class="srfb-field">
          <label class="srfb-label">Dataset</label>
          <select id="k10Selector" name="k10Selector" required class="srfb-select">
            <option value="">Select dataset…</option>
            <option value="K10">K10</option>
            <option value="Q10">Q10</option>
          </select>
        </div>

        <div class="srfb-field">
          <label class="srfb-label">Quarter</label>
          <select id="quarterSelector" name="quarterSelector" class="srfb-select" style="display:none;">
            <option value="">Select quarter…</option>
            <option value="Q1">Q1</option>
            <option value="Q2">Q2</option>
            <option value="Q3">Q3</option>
            <option value="Q4">Q4</option>
          </select>
        </div>

        <div class="srfb-field">
          <label class="srfb-label">Year</label>
          <input id="yearInput" name="yearInput" type="number" required
                 placeholder="e.g. 2025" class="srfb-input">
        </div>

      </div>

      <div class="srfb-form-footer">
        <button type="submit" class="srfb-btn">
          <span class="spinner"></span>
          <span>🔍 Search</span>
        </button>
      </div>

    </form>

    <div id="result" class="srfb-result"></div>

  </div>
</div>

<script src="/static/js/sentiment_rankings_fallback.js"></script>
</body>
</html>
